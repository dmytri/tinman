[package]
name = "tinman"
version = "0.7.0"
edition = "2024"
description = "Deterministic black-box testing framework for CLIs and full-screen TUIs, webrat/capybara/selenium for terminals. Drives real programs through a PTY under a Bubblewrap sandbox. Early prototype."
license = "0BSD"
readme = "README.md"
repository = "https://github.com/dmytri/tinman"
keywords = ["testing", "tui", "cli", "pty", "sandbox"]
categories = ["development-tools::testing", "command-line-utilities"]
exclude = ["intent", "CAPTAIN.md", ".claude"]

[dependencies]
alacritty_terminal = "0.26.0"
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.7"
clap_mangen = "0.3.0"
crossterm = "0.29.0"
dotenvy = "0.15.7"
har = "0.9.0"
hudsucker = "0.25.0"
jsonschema = { version = "0.48.5", default-features = false }
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tui-markdown = { version = "0.3.9", default-features = false }
ureq = "3.3.0"

[dev-dependencies]
cucumber = "0.23.0"

[[test]]
name = "cucumber"
harness = false

[profile.release]
# The npm package ships this binary itself, and the intended invocation is the
# unversioned `npx @dk/tinman`, so anyone who has not pinned fetches it again on
# every run. Debug symbols are weight nobody downloading it can use.
strip = true
