[package]
name = "tinman"
version = "0.1.2"
edition = "2024"
description = "Deterministic black-box testing framework for CLIs and full-screen TUIs — webrat/capybara/selenium for terminals. Drives real programs through a PTY under a Bubblewrap sandbox. Early prototype."
license = "0BSD"
readme = "README.md"
repository = "https://github.com/dmytri/tinman"
keywords = ["testing", "tui", "cli", "pty", "sandbox"]
categories = ["development-tools::testing", "command-line-utilities"]
exclude = ["idea.md", "isolation.md", "help.md", "CAPTAIN.md", ".claude"]

[dependencies]
alacritty_terminal = "0.26.0"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
dotenvy = "0.15.7"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
ureq = "3.3.0"

[dev-dependencies]
cucumber = "0.23.0"
jsonschema = "0.48.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "cucumber"
harness = false
