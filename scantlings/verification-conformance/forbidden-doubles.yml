id: forbidden-doubles
language: rust
severity: error
message: A test double in verification support needs an inline @exceptional-double mark.
note: |
  Real by default: verification exercises real behaviour against production-shaped
  environments. A double is allowed only for the three named conditions in the
  Verification agreement, and every one is marked and justified inline with
  @exceptional-double naming which condition applies. This rule reddens a mock, fake,
  stub or dummy type declared in verification support; the mark is what clears it.
files:
  - tests/**
rule:
  any:
    - kind: struct_item
      regex: '(?i)\b(Mock|Fake|Stub|Dummy)[A-Z_]'
    - kind: enum_item
      regex: '(?i)\b(Mock|Fake|Stub|Dummy)[A-Z_]'
