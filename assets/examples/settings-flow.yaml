# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/dmytri/tinman@v0.2.0/scantlings/harness-plan.schema.json
# Canonical full-form plan. Paired with settings-flow-shorthand.yaml, which
# parses to an identical plan.
sandbox:
  home: empty
  network: deny

flow:
  - tui:
      command: opencode
      steps:
        - activate:
            role: menuitem
            name: Settings
        - fill:
            label: Username
            value: dmytri
        - activate:
            role: button
            name: Save
        - expect:
            text: Saved
